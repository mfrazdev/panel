name: Build Project

on:
  push:
    branches:
      - master
      - canary

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: versioning
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git fetch --tags --quiet
          
          LATEST_TAG=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          
          TAG_FOUND=true
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.1"
            TAG_FOUND=false
          fi
          
          IFS='.' read -r -a VERSION_PARTS <<< "$LATEST_TAG"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          if [[ "$COMMIT_MSG" =~ release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            NEXT_VERSION="${BASH_REMATCH[1]}"
          else
            if [[ "$BRANCH_NAME" == "canary" ]]; then
              NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            else
              if [ "$TAG_FOUND" = true ]; then
                PATCH=$((PATCH + 1))
              fi
              NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            fi
          fi
          
          if [[ "$BRANCH_NAME" == "canary" ]]; then
            FINAL_TAG="${NEXT_VERSION}-canary-${SHORT_SHA}"
            IS_LATEST="false"
          else
            FINAL_TAG="${NEXT_VERSION}"
            IS_LATEST="true"
          fi
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_ENV
          echo "IS_LATEST=$IS_LATEST" >> $GITHUB_ENV

      - name: Save Version to File
        run: |
          echo "{\"version\": \"${{ env.TAG_NAME }}\"}" > version.json

      # NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node Dependencies
        run: pnpm install

      - name: Build Frontend
        run: pnpm run build

      - name: Remove Node Modules and .vatts
        run: |
          rm -rf node_modules
          rm -rf .vatts

      # PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      # ENCODE IONCUBE - AGORA COM OS PARÂMETROS EXATOS DA ACTION
      - name: Encode with IonCube
        uses: MuriloChianfa/ioncube-encoder-action@v3.0.1
        with:
          php-target-version: '8.2' # A action aceita max 8.2 no arquivo YML (Roda perfeitamente em 8.3 depois)
          template: 'laravel'       # Template pronto para não quebrar o Laravel
          source: '.'
          output: '/tmp/encoded_build'
          ignore: '.git .github web dist resources storage public' # Espaço como separador conforme documentação

      - name: Replace Original Files with Encoded Files
        run: |
          echo "Sincronizando arquivos codificados de volta para a pasta de build..."
          # Passa os arquivos codificados por cima dos originais
          rsync -av /tmp/encoded_build/ ./
          rm -rf /tmp/encoded_build

      # INSTALAÇÃO DO COMPOSER
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative

      # ZIP
      - name: Create ZIP
        run: |
          zip -r panel.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x ".github/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: panel.zip

      # RELEASE
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: v${{ env.TAG_NAME }}
          files: panel.zip
          generate_release_notes: true
          make_latest: ${{ env.IS_LATEST }}

      # LIMPEZA DE ARTIFACTS
      - name: Delete Artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: production-build
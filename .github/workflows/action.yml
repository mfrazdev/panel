name: Build Project

on:
  push:
    branches:
      - master
      - canary

# Adicionado para permitir que o bot do GitHub Actions crie a release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para baixar o histórico e ler as tags anteriores

      - name: Calculate Version
        id: versioning
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Puxa todas as tags
          git fetch --tags --quiet
          
          # Busca a última tag no formato X.X.X, ignorando as de canary
          LATEST_TAG=$(git tag --list --sort=-v:refname "[0-9]*.[0-9]*.[0-9]*" | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.0"
          fi
          
          # Separa em Major, Minor e Patch
          IFS='.' read -r -a VERSION_PARTS <<< "$LATEST_TAG"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          # Verifica se há "release vX.X.X" na mensagem de commit
          if [[ "$COMMIT_MSG" =~ release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            NEXT_VERSION="${BASH_REMATCH[1]}"
          else
            # Se não houver, incrementa o patch automaticamente
            PATCH=$((PATCH + 1))
            NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          
          # Lógica para o branch
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          if [[ "$BRANCH_NAME" == "canary" ]]; then
            FINAL_TAG="canary-${NEXT_VERSION}-${SHORT_SHA}"
            IS_LATEST="false"
          else
            FINAL_TAG="${NEXT_VERSION}"
            IS_LATEST="true"
          fi
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_ENV
          echo "IS_LATEST=$IS_LATEST" >> $GITHUB_ENV

      # NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node Dependencies
        run: pnpm install

      - name: Build Frontend
        run: pnpm run build

      - name: Remove node_modules
        run: rm -rf node_modules

      # PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      # ZIP
      - name: Create ZIP
        run: |
          zip -r panel.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x ".github/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: project.zip

      # RELEASE
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: v${{ env.TAG_NAME }}
          files: panel.zip
          generate_release_notes: true
          make_latest: ${{ env.IS_LATEST }}

      # LIMPEZA DE ARTIFACTS
      - name: Delete Artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: production-build
name: Build Project

on:
  push:
    branches:
      - master
      - canary

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: versioning
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git fetch --tags --quiet
          
          LATEST_TAG=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          
          TAG_FOUND=true
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.1"
            TAG_FOUND=false
          fi
          
          IFS='.' read -r -a VERSION_PARTS <<< "$LATEST_TAG"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          if [[ "$COMMIT_MSG" =~ release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            NEXT_VERSION="${BASH_REMATCH[1]}"
          else
            if [[ "$BRANCH_NAME" == "canary" ]]; then
              NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            else
              if [ "$TAG_FOUND" = true ]; then
                PATCH=$((PATCH + 1))
              fi
              NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            fi
          fi
          
          if [[ "$BRANCH_NAME" == "canary" ]]; then
            FINAL_TAG="${NEXT_VERSION}-canary-${SHORT_SHA}"
            IS_LATEST="false"
          else
            FINAL_TAG="${NEXT_VERSION}"
            IS_LATEST="true"
          fi
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_ENV
          echo "IS_LATEST=$IS_LATEST" >> $GITHUB_ENV

      - name: Save Version to File
        run: |
          echo "{\"version\": \"${{ env.TAG_NAME }}\"}" > version.json

      # NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node Dependencies
        run: pnpm install

      - name: Build Frontend
        run: pnpm run build

      - name: Remove Node Modules and .vatts
        run: |
          rm -rf node_modules
          rm -rf .vatts

      # PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative

      # Backup das Views para garantir que não fiquem codificadas
      - name: Backup Original Views
        run: cp -r src/views /tmp/original_views

      # 2. ENCODE IONCUBE
      - name: Encode with IonCube
        uses: MuriloChianfa/ioncube-encoder-action@v3.0.1
        with:
          trial: true
          binary: true
          create-target: true
          php-target-version: '8.2'
          template: 'laravel'
          source: '.'
          output: '/tmp/encoded_build'
          ignore: '.git .github web dist resources storage public vendor'

      # Limpeza e Restauração (Sem corromper os binários)
      - name: Post-Encoding Cleanup and Restore
        run: |
          echo "Restaurando views originais (Copy/Paste method)..."
          # Removemos a pasta que o ionCube tentou mexer e colocamos a sua original
          rm -rf /tmp/encoded_build/src/views
          cp -r /tmp/original_views /tmp/encoded_build/src/views
          
          echo "Sincronizando arquivos de volta para a pasta de build..."
          rsync -av /tmp/encoded_build/ ./
          
          echo "Removendo o binário de 40MB do ionCube Trial..."
          rm -rf ioncube_encoder_evaluation
          rm -rf /tmp/encoded_build
          rm -rf /tmp/original_views

      # ZIP
      - name: Create ZIP
        run: |
          zip -r panel.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x ".github/*" \
            -x "ioncube_encoder_evaluation/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: panel.zip

      # RELEASE
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: v${{ env.TAG_NAME }}
          files: panel.zip
          generate_release_notes: true
          make_latest: ${{ env.IS_LATEST }}

      # LIMPEZA DE ARTIFACTS
      - name: Delete Artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: production-build
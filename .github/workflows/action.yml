name: Build Project

on:
  push:
    branches:
      - master
      - canary

# Adicionado para permitir que o bot do GitHub Actions crie a release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para baixar o histórico e ler as tags anteriores

      - name: Calculate Version
        id: versioning
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Puxa todas as tags
          git fetch --tags --quiet
          
          # Busca a última tag no formato X.X.X, ignorando as de canary
          LATEST_TAG=$(git tag --list --sort=-v:refname "[0-9]*.[0-9]*.[0-9]*" | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.0"
          fi
          
          # Separa em Major, Minor e Patch
          IFS='.' read -r -a VERSION_PARTS <<< "$LATEST_TAG"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          # Verifica se há "release vX.X.X" na mensagem de commit
          if [[ "$COMMIT_MSG" =~ release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            NEXT_VERSION="${BASH_REMATCH[1]}"
          else
            if [[ "$BRANCH_NAME" == "canary" ]]; then
                # Se for canary, mantém a versão atual (LATEST_TAG) como base
                NEXT_VERSION="$LATEST_TAG"
            else
                # Se não houver, incrementa o patch automaticamente (apenas na master)
                PATCH=$((PATCH + 1))
                NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            fi
          fi
          
          if [[ "$BRANCH_NAME" == "canary" ]]; then
            FINAL_TAG="${NEXT_VERSION}-canary-${SHORT_SHA}"
            IS_LATEST="false"
          else
            FINAL_TAG="${NEXT_VERSION}"
            IS_LATEST="true"
          fi
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_ENV
          echo "IS_LATEST=$IS_LATEST" >> $GITHUB_ENV

      # NOVO PASSO: Salva a versão calculada em um arquivo JSON na raiz do projeto
      - name: Save Version to File
        run: |
          echo "{\"version\": \"${{ env.TAG_NAME }}\"}" > version.json

      # NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node Dependencies
        run: pnpm install

      - name: Build Frontend
        run: pnpm run build

      - name: Remove Node Modules and .vatts
        run: |
          rm -rf node_modules
          rm -rf .vatts

      # PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      # OBFUSCAÇÃO YAK PRO
      - name: Setup YAK Pro Obfuscator
        run: |
          git clone https://github.com/pk-fr/yakpro-po.git /tmp/yakpro-po
          cd /tmp/yakpro-po
          git clone https://github.com/nikic/PHP-Parser.git --branch 4.x
          chmod a+x yakpro-po.php
          sudo ln -s /tmp/yakpro-po/yakpro-po.php /usr/local/bin/yakpro-po

      - name: Obfuscate Project (Including Vendor)
        run: |
          echo "Criando arquivo de configuração do YAK Pro..."
          cat << 'EOF' > yakpro-po.cnf
          <?php
          // Protege o Frontend, arquivos estáticos e o core do Composer
          // 'dist' protege o serve/dist (evitando o loop infinito).
          // 'public' protege a pasta public inteira.
          // 'web' protege o src/web.
          // 'composer' protege os arquivos do vendor/composer para não quebrar o autoloader.
          $conf->t_ignore_directories_tree = array('.git', '.github', 'node_modules', 'web', 'dist', 'resources', 'storage', 'public', 'composer');
          
          // Ignora o index do vendor do composer para proteger as strings cruciais de dependências
          $conf->t_ignore_files = array('autoload.php');
          
          // Mantém nomes estruturais para não quebrar autoload do Composer e Vendor
          $conf->obfuscate_class_name = false;
          $conf->obfuscate_interface_name = false;
          $conf->obfuscate_trait_name = false;
          $conf->obfuscate_property_name = false;
          $conf->obfuscate_method_name = false;
          $conf->obfuscate_function_name = false;
          
          // Desativa a ofuscação de constantes para evitar erros com as funções defined() do Laravel/Illuminate
          $conf->obfuscate_constant_name = false;
          $conf->obfuscate_class_constant_name = false;
          EOF

          echo "Iniciando ofuscação do backend..."
          mkdir -p /tmp/obfuscated_build
          
          # Ofusca as lógicas do PHP baseando-se no yakpro-po.cnf recém-criado
          yakpro-po . -o /tmp/obfuscated_build
          
          # Encontra a pasta raiz gerada pelo YAK Pro (pois ela varia baseada no caminho absoluto de execução)
          # e copia o seu conteúdo diretamente para a raiz do nosso projeto
          OBFUSCATED_ROOT_DIR=$(find /tmp/obfuscated_build/yakpro-po -mindepth 1 -maxdepth 1 -type d | head -n 1)
          
          if [ -n "$OBFUSCATED_ROOT_DIR" ]; then
            # Pega o caminho completo até onde está o código de fato e copia
            REAL_PATH_TO_CODE=$(find "$OBFUSCATED_ROOT_DIR" -type d -name "panel" | head -n 1)
            if [ -n "$REAL_PATH_TO_CODE" ]; then
                rsync -a "$REAL_PATH_TO_CODE/" ./
            else
                # Fallback caso a estrutura de pastas seja um pouco diferente, copia tudo da raiz encontrada
                rsync -a "$OBFUSCATED_ROOT_DIR/" ./
            fi
          else
            echo "Aviso: Diretório ofuscado não encontrado. Verifique se o YAK Pro funcionou corretamente."
          fi
          
          # Limpeza
          rm yakpro-po.cnf
          rm -rf /tmp/obfuscated_build

      # ZIP
      - name: Create ZIP
        run: |
          zip -r panel.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x ".github/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: panel.zip

      # RELEASE
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: v${{ env.TAG_NAME }}
          files: panel.zip
          generate_release_notes: true
          make_latest: ${{ env.IS_LATEST }}

      # LIMPEZA DE ARTIFACTS
      - name: Delete Artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: production-build
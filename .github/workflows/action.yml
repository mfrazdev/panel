name: Build Project

on:
  push:
    branches:
      - master
      - canary

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: versioning
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git fetch --tags --quiet

          # Pega a última tag estável (x.x.x)
          LATEST_STABLE=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          
          # Se não houver tag estável, define uma base
          if [ -z "$LATEST_STABLE" ]; then
            BASE_TAG="0.0.1"
            HAS_STABLE=false
          else
            BASE_TAG="$LATEST_STABLE"
            HAS_STABLE=true
          fi
          
          IFS='.' read -r -a VERSION_PARTS <<< "$BASE_TAG"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          # Lógica de Versão
          if [[ "$COMMIT_MSG" =~ release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            NEXT_VERSION="${BASH_REMATCH[1]}"
          else
            if [[ "$BRANCH_NAME" == "canary" ]]; then
              # Canary usa a base da última estável
              NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            else
              # Stable incrementa o patch se já existir uma tag
              if [ "$HAS_STABLE" = true ]; then
                PATCH=$((PATCH + 1))
              fi
              NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            fi
          fi
          
          # Lógica de Tag Final e IS_LATEST
          if [[ "$BRANCH_NAME" == "canary" ]]; then
            LAST_CANARY=$(git tag --list "${NEXT_VERSION}-canary.*" --sort=-v:refname | head -n 1)
            if [[ "$LAST_CANARY" =~ -canary\.([0-9]+)$ ]]; then
              CANARY_NUMBER=$((BASH_REMATCH[1] + 1))
            else
              CANARY_NUMBER=1
            fi
            FINAL_TAG="${NEXT_VERSION}-canary.${CANARY_NUMBER}"
          
            # IS_LATEST para Canary: Só é true se NÃO existir nenhuma versão estável no repositório
            if [ "$HAS_STABLE" = false ]; then
              IS_LATEST="true"
            else
              IS_LATEST="false"
            fi
          else
            FINAL_TAG="${NEXT_VERSION}"
            IS_LATEST="true"
          fi
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_ENV
          echo "IS_LATEST=$IS_LATEST" >> $GITHUB_ENV

          echo "Generated tag: $FINAL_TAG"
          echo "Is latest: $IS_LATEST"

      - name: Save Version to File
        run: |
          echo "{\"version\": \"${{ env.TAG_NAME }}\"}" > version.json

      # NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node Dependencies
        run: pnpm install

      - name: Build Frontend
        run: pnpm run build

      - name: Remove Node Modules and .vatts
        run: |
          rm -rf node_modules
          rm -rf .vatts

      # PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative

      # Backup das Views
      - name: Backup Original Views
        run: cp -r src/views /tmp/original_views

      # 2. ENCODE IONCUBE
      - name: Encode with IonCube
        uses: MuriloChianfa/ioncube-encoder-action@v3.0.1
        with:
          trial: false
          binary: true
          create-target: true
          php-target-version: '8.2'
          template: 'laravel'
          source: '.'
          output: '/tmp/encoded_build'
          ignore: '.git .github web dist resources storage public vendor'

      # Limpeza e Restauração
      - name: Post-Encoding Cleanup and Restore
        run: |
          rm -rf /tmp/encoded_build/src/views
          cp -r /tmp/original_views /tmp/encoded_build/src/views
          rsync -av /tmp/encoded_build/ ./
          rm -rf ioncube_encoder_evaluation /tmp/encoded_build /tmp/original_views .git composer.json composer.lock
          mkdir -p t-cache

      # ZIP
      - name: Create ZIP
        run: |
          zip -r panel.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x ".github/*" \
            -x "ioncube_encoder_evaluation/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: panel.zip

      # RELEASE
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.TAG_NAME }}
          files: panel.zip
          generate_release_notes: true
          make_latest: ${{ env.IS_LATEST }}
          # Força a criação da tag no commit atual para os Source Codes ficarem corretos
          prerelease: ${{ contains(env.TAG_NAME, 'canary') }}

      # LIMPEZA DE ARTIFACTS
      - name: Delete Artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: production-build
name: Build Project

on:
  push:
    branches:
      - master
      - canary

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: versioning
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git fetch --tags --quiet

          # Pega a última tag estável (x.x.x)
          LATEST_STABLE=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          
          if [ -z "$LATEST_STABLE" ]; then
            BASE_TAG="0.0.1"
            HAS_STABLE=false
          else
            BASE_TAG="$LATEST_STABLE"
            HAS_STABLE=true
          fi
          
          IFS='.' read -r -a VERSION_PARTS <<< "$BASE_TAG"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          if [[ "$COMMIT_MSG" =~ release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            NEXT_VERSION="${BASH_REMATCH[1]}"
          else
            if [[ "$BRANCH_NAME" == "canary" ]]; then
              NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            else
              if [ "$HAS_STABLE" = true ]; then
                PATCH=$((PATCH + 1))
              fi
              NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            fi
          fi
          
          if [[ "$BRANCH_NAME" == "canary" ]]; then
            LAST_CANARY=$(git tag --list "${NEXT_VERSION}-canary.*" --sort=-v:refname | head -n 1)
            if [[ "$LAST_CANARY" =~ -canary\.([0-9]+)$ ]]; then
              CANARY_NUMBER=$((BASH_REMATCH[1] + 1))
            else
              CANARY_NUMBER=1
            fi
            FINAL_TAG="${NEXT_VERSION}-canary.${CANARY_NUMBER}"
          
            # IS_LATEST para Canary: Só é true se NÃO existir nenhuma versão estável
            if [ "$HAS_STABLE" = false ]; then
              IS_LATEST="true"
            else
              IS_LATEST="false"
            fi
          else
            FINAL_TAG="${NEXT_VERSION}"
            IS_LATEST="true"
          fi
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_ENV
          echo "IS_LATEST=$IS_LATEST" >> $GITHUB_ENV

      - name: Save Version to File
        run: |
          echo "{\"version\": \"${{ env.TAG_NAME }}\"}" > version.json

      # NODE SETUP & BUILD
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node Dependencies
        run: pnpm install

      - name: Build Frontend
        run: pnpm run build

      - name: Remove Node Modules
        run: rm -rf node_modules .vatts

      # PHP SETUP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative

      - name: Backup Original Views
        run: cp -r src/views /tmp/original_views

      # IONCUBE ENCODING
      - name: Encode with IonCube
        uses: MuriloChianfa/ioncube-encoder-action@v3.0.1
        with:
          trial: true
          binary: true
          create-target: true
          php-target-version: '8.2'
          template: 'laravel'
          source: '.'
          output: '/tmp/encoded_build'
          ignore: '.git .github web dist resources storage public vendor'

      # HACK: TENTATIVA DE LIMPEZA SEM QUEBRAR O HASH
      - name: Post-Encoding Cleanup and Restore
        run: |
          echo "Limpando avisos do IonCube (Space Replacement Hack)..."
          # Em vez de deletar a linha, substituímos por espaços para manter o tamanho do arquivo idêntico.
          # Isso evita o erro de "file is corrupted" se o loader checar o offset dos bytes.
          find /tmp/encoded_build -name "*.php" -exec perl -i -pe 's/IONCUBE ENCODER 15\.0 EVALUATION/                               /g' {} +
          find /tmp/encoded_build -name "*.php" -exec perl -i -pe 's/THIS LICENSE MESSAGE IS ONLY ADDED BY THE EVALUATION ENCODER/                                                            /g' {} +
          find /tmp/encoded_build -name "*.php" -exec perl -i -pe 's/IS NOT PRESENT IN PRODUCTION ENCODED FILES/                                          /g' {} +
          
          echo "Restaurando views originais..."
          rm -rf /tmp/encoded_build/src/views
          cp -r /tmp/original_views /tmp/encoded_build/src/views
          
          echo "Sincronizando arquivos..."
          rsync -av /tmp/encoded_build/ ./
          
          echo "Limpando lixo..."
          rm -rf ioncube_encoder_evaluation /tmp/encoded_build /tmp/original_views .git composer.json composer.lock
          mkdir -p t-cache

      # ZIP
      - name: Create ZIP
        run: |
          zip -r panel.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x ".github/*" \
            -x "ioncube_encoder_evaluation/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: panel.zip

      # RELEASE
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.TAG_NAME }}
          files: panel.zip
          generate_release_notes: true
          make_latest: ${{ env.IS_LATEST }}
          prerelease: ${{ contains(env.TAG_NAME, 'canary') }}

      - name: Delete Artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: production-build
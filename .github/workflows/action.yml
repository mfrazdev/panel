name: Build Project

on:
  push:
    branches:
      - master
      - canary

# Adicionado para permitir que o bot do GitHub Actions crie a release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para baixar o histórico e ler as tags anteriores

      - name: Calculate Version
        id: versioning
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Puxa todas as tags
          git fetch --tags --quiet
          
          # Busca a última tag ESTÁVEL (exatamente X.X.X)
          # O $ no final garante que ele IGNORA tags que tenham "-canary-..."
          LATEST_TAG=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          
          TAG_FOUND=true
          if [ -z "$LATEST_TAG" ]; then
            # Começa direto em 0.0.1 se não houver tags
            LATEST_TAG="0.0.1"
            TAG_FOUND=false
          fi
          
          # Separa em Major, Minor e Patch
          IFS='.' read -r -a VERSION_PARTS <<< "$LATEST_TAG"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          # Verifica se há "release vX.X.X" na mensagem de commit
          if [[ "$COMMIT_MSG" =~ release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            NEXT_VERSION="${BASH_REMATCH[1]}"
          else
            if [[ "$BRANCH_NAME" == "canary" ]]; then
              # NO CANARY: Não aumenta a versão. Usa a versão base.
              NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            else
              # NA MASTER: Aumenta o patch apenas se já existia uma tag antes.
              if [ "$TAG_FOUND" = true ]; then
                PATCH=$((PATCH + 1))
              fi
              NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            fi
          fi
          
          if [[ "$BRANCH_NAME" == "canary" ]]; then
            # Garante que o final fica limpo: ex. 0.0.1-canary-a1b2c3d
            FINAL_TAG="${NEXT_VERSION}-canary-${SHORT_SHA}"
            IS_LATEST="false"
          else
            FINAL_TAG="${NEXT_VERSION}"
            IS_LATEST="true"
          fi
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_ENV
          echo "IS_LATEST=$IS_LATEST" >> $GITHUB_ENV

      # Salva a versão calculada em um arquivo JSON na raiz do projeto
      - name: Save Version to File
        run: |
          echo "{\"version\": \"${{ env.TAG_NAME }}\"}" > version.json

      # NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node Dependencies
        run: pnpm install

      - name: Build Frontend
        run: pnpm run build

      - name: Remove Node Modules and .vatts
        run: |
          rm -rf node_modules
          rm -rf .vatts

      # PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      # ENCODE IONCUBE
      - name: Encode with IonCube
        uses: MuriloChianfa/ioncube-encoder-action@v1
        with:
          php-version: '8.3'
          source: '.'
          destination: '/tmp/encoded_build'
          # Os argumentos abaixo ignoram as mesmas pastas que o YAK Pro ignorava.
          # Adicione ou remova pastas usando --ignore 'nome_da_pasta/'
          args: "--ignore '.git/' --ignore '.github/' --ignore 'web/' --ignore 'dist/' --ignore 'resources/' --ignore 'storage/' --ignore 'public/'"

      - name: Replace Original Files with Encoded Files
        run: |
          echo "Sincronizando arquivos codificados de volta para a pasta de build..."
          rsync -av /tmp/encoded_build/ ./
          rm -rf /tmp/encoded_build

      # INSTALAÇÃO DO COMPOSER
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative

      # ZIP
      - name: Create ZIP
        run: |
          zip -r panel.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x ".github/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: panel.zip

      # RELEASE
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: v${{ env.TAG_NAME }}
          files: panel.zip
          generate_release_notes: true
          make_latest: ${{ env.IS_LATEST }}

      # LIMPEZA DE ARTIFACTS
      - name: Delete Artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: production-build